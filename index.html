<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Longest Path · CSC 296</title>
  <meta name="description" content="A pictured walkthrough of the CSC 296 assignment: the 20-day project network and the juice-profit linear program." />
  <meta name="theme-color" content="#F3F0E8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f0e8;
      --surface: #fffdf8;
      --fg: #1a1916;
      --muted: #6b6560;
      --primary: #2f5d56;
      --primary-fg: #f3f0e8;
      --border: #d4cdc0;
      --soft: #3f3a36;
      --ok: #3f6b4a;
      --danger: #8f3d33;
      --warn: #8a5a32;
      --path-dim: #c9c2b4;
      --shadow: 0 1px 0 rgba(26,25,22,.04), 0 12px 32px -20px rgba(26,25,22,.18);
      --ease: cubic-bezier(.22,1,.36,1);
      --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
      --display: "Fraunces", "Iowan Old Style", Palatino, serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: var(--display); font-weight: 550; letter-spacing: -.03em; line-height: 1.15; text-wrap: balance; margin: 0; }
    p { margin: 0; text-wrap: pretty; }
    a { color: inherit; text-decoration: none; }
    button, [role="button"] { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .4; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 0 1rem; }
    @media (min-width: 640px) { .wrap { padding: 0 1.5rem; } }
    header.top { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid color-mix(in oklab, var(--border) 80%, transparent); background: color-mix(in oklab, var(--bg) 90%, transparent); backdrop-filter: blur(8px); }
    header.top .inner { display: flex; align-items: center; justify-content: space-between; gap: .75rem; height: 3.5rem; }
    .brand { font-family: var(--display); font-size: 1.15rem; letter-spacing: -.03em; }
    nav { display: flex; gap: .25rem; font-size: .9rem; }
    nav a { border-radius: 8px; padding: .5rem .7rem; color: var(--muted); }
    nav a:hover { background: color-mix(in oklab, var(--fg) 5%, transparent); color: var(--fg); }
    nav a.on { background: var(--fg); color: var(--bg); }
    .kicker { font-size: .75rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); }
    .soft { color: var(--soft); }
    .ok { color: var(--ok); }
    .danger { color: var(--danger); }
    .panel { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 1rem 1.15rem; box-shadow: var(--shadow); }
    @media (min-width: 640px) { .panel { padding: 1.4rem 1.5rem; } }
    .key { border-left: 2px solid var(--primary); padding-left: 1rem; font-weight: 600; line-height: 1.35; }
    .card { display: flex; flex-direction: column; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 1.25rem; box-shadow: var(--shadow); transition: border-color .2s var(--ease), transform .15s var(--ease); }
    .card:hover { border-color: color-mix(in oklab, var(--fg) 30%, var(--border)); }
    .card:active { transform: scale(.98); }
    .grid2 { display: grid; gap: 1rem; }
    @media (min-width: 640px) { .grid2.sm { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1024px) { .grid2.lg { grid-template-columns: 1fr 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th { text-align: left; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: .7rem 1rem; }
    td { padding: .7rem 1rem; border-top: 1px solid color-mix(in oklab, var(--border) 70%, transparent); }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .display { font-family: var(--display); letter-spacing: -.03em; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.75rem; padding: 0 1rem; border-radius: 8px; border: 1px solid transparent; font-size: .9rem; font-weight: 500; transition: transform .15s var(--ease), background .15s; }
    .btn:active:not(:disabled) { transform: scale(.96); }
    .btn.primary { background: var(--primary); color: var(--primary-fg); }
    .btn.outline { background: var(--surface); border-color: var(--border); }
    .btn.outline:hover:not(:disabled) { border-color: color-mix(in oklab, var(--fg) 30%, var(--border)); }
    .btn.chip { height: 2.75rem; border: 1px solid var(--border); background: var(--surface); padding: 0 .85rem; border-radius: 8px; }
    .btn.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .choice { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: .75rem .9rem; margin-top: .5rem; }
    .choice.on { border-color: var(--fg); background: color-mix(in oklab, var(--fg) 5%, var(--surface)); }
    .bar-track { height: 8px; overflow: hidden; border-radius: 999px; background: var(--border); }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--primary); }
    .bar-fill.over { background: var(--danger); }
    input[type=range] { width: 100%; height: 2.75rem; accent-color: var(--primary); }
    .dock { position: fixed; inset: auto 0 0 0; z-index: 20; border-top: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 95%, transparent); backdrop-filter: blur(8px); }
    .dots { display: flex; gap: 6px; margin-top: 1.1rem; }
    .dots button { flex: 1; height: 6px; border: 0; border-radius: 999px; background: var(--border); padding: 0; }
    .dots button.on { background: var(--primary); }
    .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .home { padding: 2.5rem 0 4rem; }
    .lesson { padding: 1.25rem 0 7rem; min-height: calc(100dvh - 3.5rem); display: flex; flex-direction: column; }
    .back { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .9rem; margin-bottom: 1.1rem; }
    .back:hover { color: var(--fg); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  const ACTIVITIES = [
    { id: "A", duration: 3, waitFor: "Nothing. A is the first job." },
    { id: "B", duration: 4, waitFor: "A must finish first." },
    { id: "C", duration: 2, waitFor: "A must finish first." },
    { id: "D", duration: 5, waitFor: "B must finish first." },
    { id: "E", duration: 1, waitFor: "C must finish first." },
    { id: "F", duration: 2, waitFor: "C must finish first." },
    { id: "G", duration: 4, waitFor: "Both D and E must finish. G waits for the slower of the two." },
    { id: "H", duration: 4, waitFor: "Both F and G must finish. H waits for the slower of the two." },
  ];
  const ORDER = ["A","B","C","D","E","F","G","H"];
  const TIMES = {
    A:{es:0,ef:3,ls:0,lf:3,slack:0},
    B:{es:3,ef:7,ls:3,lf:7,slack:0},
    C:{es:3,ef:5,ls:9,lf:11,slack:6},
    D:{es:7,ef:12,ls:7,lf:12,slack:0},
    E:{es:5,ef:6,ls:11,lf:12,slack:6},
    F:{es:5,ef:7,ls:14,lf:16,slack:9},
    G:{es:12,ef:16,ls:12,lf:16,slack:0},
    H:{es:16,ef:20,ls:16,lf:20,slack:0},
  };
  const CRITICAL = ["A","B","D","G","H"];
  const SLACK_ACTIVITIES = ["C","E","F"];
  const PATHS = [
    { id:"p1", nodes:["A","B","D","G","H"], days:20, label:"A → B → D → G → H", note:"The long way. 3+4+5+4+4 = 20 days." },
    { id:"p2", nodes:["A","C","E","G","H"], days:14, label:"A → C → E → G → H", note:"A shorter side road. 3+2+1+4+4 = 14 days." },
    { id:"p3", nodes:["A","C","F","H"], days:11, label:"A → C → F → H", note:"The shortest road. 3+2+2+4 = 11 days." },
  ];
  const FORWARD_BEATS = {
    A:{title:"A has no one in front of it", body:"We start the clock at day 0. A takes 3 days, so it finishes on day 3. Write ES = 0, EF = 3."},
    B:{title:"B waits for A", body:"A finishes on day 3, so the earliest B can start is day 3. B takes 4 days. ES = 3, EF = 7."},
    C:{title:"C also waits for A", body:"Same start as B: day 3. C is shorter — only 2 days — so it finishes on day 5. ES = 3, EF = 5."},
    D:{title:"D waits for B", body:"B finishes on day 7, so D starts then. D is a long job: 5 days. ES = 7, EF = 12."},
    E:{title:"E waits for C", body:"C finishes on day 5. E only takes 1 day. ES = 5, EF = 6. Fast, but not on the long road."},
    F:{title:"F waits for C", body:"Also after C, so it starts on day 5 and takes 2 days. ES = 5, EF = 7."},
    G:{title:"G waits for both D and E — take the slower one", body:"D finishes on day 12. E finishes on day 6. G cannot start until BOTH are done, so it waits until day 12. Then 4 days of work. ES = 12, EF = 16. When two arrows come in, use the later finish."},
    H:{title:"H waits for both F and G", body:"F is done on day 7. G is done on day 16. H waits for the later one: day 16. Then 4 days. ES = 16, EF = 20. The project cannot finish before H does, so the whole project is 20 days."},
  };
  const BACKWARD_ORDER = ["H","G","F","D","E","B","C","A"];
  const BACKWARD_BEATS = {
    H:{title:"Start from the end", body:"The project ends on day 20. H takes 4 days, so the latest it can start is day 16. LS = 16, LF = 20. Same as its earliest times — H has no spare time."},
    G:{title:"G has to be done before H starts", body:"H must start by day 16, so G must finish by day 16. G takes 4 days, so it must start by day 12. LS = 12, LF = 16."},
    F:{title:"F also feeds H — but it has room", body:"H must start by 16, so F must finish by 16. F only takes 2 days, so it could start as late as day 14. LS = 14, LF = 16."},
    D:{title:"D has to feed G on time", body:"G must start by 12, so D must finish by 12. D takes 5 days → LS = 7, LF = 12. Same as earliest. No spare time."},
    E:{title:"E also feeds G — with spare time", body:"G must start by 12, so E must finish by 12. E only takes 1 day, so it could start as late as day 11. LS = 11, LF = 12."},
    B:{title:"B has to feed D on time", body:"D must start by 7, so B must finish by 7. B takes 4 days → LS = 3, LF = 7. Tight. No spare time."},
    C:{title:"C feeds two jobs — use the tighter deadline", body:"E must start by 11, F must start by 14. C has to satisfy the earlier one: finish by day 11. C takes 2 days → LS = 9, LF = 11. Slack = 6 days."},
    A:{title:"A feeds B and C — use the tighter one", body:"B must start by day 3, C by day 9. The tighter one is B. So A must finish by day 3. A takes 3 days → LS = 0, LF = 3."},
  };
  const NODES = [
    {id:"A",x:16,y:118},{id:"B",x:188,y:10},{id:"C",x:188,y:186},
    {id:"D",x:360,y:10},{id:"E",x:360,y:156},{id:"F",x:360,y:248},
    {id:"G",x:540,y:92},{id:"H",x:712,y:92},
  ];
  const EDGES = [["A","B"],["A","C"],["B","D"],["C","E"],["C","F"],["D","G"],["E","G"],["F","H"],["G","H"]];
  const NW = 104, NH = 74;
  const pos = (id) => NODES.find(n => n.id === id);
  function edgePath(from, to) {
    const a = pos(from), b = pos(to);
    const x1 = a.x + NW, y1 = a.y + NH/2, x2 = b.x, y2 = b.y + NH/2, mid = (x1+x2)/2;
    return `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
  }
  function naira(n){ return "₦" + Math.round(n).toLocaleString("en-NG"); }
  const CORNERS = [
    {id:"none", x:0, y:0, z:0, label:"Make nothing", mix:"0 L mango, 0 L orange", why:"Uses no resources. Earns nothing. A legal point, but a bad business."},
    {id:"mango", x:20, y:0, z:10000, label:"All mango", mix:"20 L mango, 0 L orange", why:"Uses every kilogram of sugar and every litre of water. Highest profit of the three corners."},
    {id:"orange", x:0, y:15, z:4500, label:"All orange", mix:"0 L mango, 15 L orange", why:"Water runs out first (60 L). Sugar still has 25 kg left unused. Profit is only ₦4,500."},
  ];

  const S = {
    page: "home",
    nStep: 0, jStep: 0,
    selected: "A", pathId: "p1",
    fwd: 0, bwd: 0, focus: "critical",
    nQuiz: {path:null, duration:null, picked: new Set()},
    maths: {z:false,s:false,w:false,n:false},
    mix: {x:8, y:4},
    corner: "mango",
    jQuiz: {obj:null, mix:null, z:null},
  };

  function loadStep(key, total) {
    try { const n = Number(localStorage.getItem(key)); if (Number.isFinite(n)) return Math.min(total-1, Math.max(0, n)); } catch(e){}
    return 0;
  }
  function saveStep(key, n){ try { localStorage.setItem(key, String(n)); } catch(e){} }
  S.nStep = loadStep("tlp-network-step", 9);
  S.jStep = loadStep("tlp-juice-step", 7);

  function route() {
    const h = (location.hash || "#/").replace(/^#/, "");
    if (h.startsWith("/network")) return "network";
    if (h.startsWith("/juice")) return "juice";
    return "home";
  }
  function go(hash){ location.hash = hash; }

  function chrome(active, inner) {
    return `<header class="top"><div class="wrap inner">
      <a class="brand" href="#/">The Longest Path</a>
      <nav>
        <a href="#/" class="${active==="home"?"on":""}">Home</a>
        <a href="#/network" class="${active==="network"?"on":""}">The project</a>
        <a href="#/juice" class="${active==="juice"?"on":""}">The juices</a>
      </nav>
    </div></header>${inner}`;
  }

  function networkSvg(opts={}) {
    const mode = opts.mode || "plain";
    const selected = opts.selected || null;
    const path = opts.path || null;
    const revealed = opts.revealed || null;
    const highlight = path ? new Set(path) : null;
    const clickable = !!opts.clickable;
    let edges = EDGES.map(([f,t]) => {
      const onPath = highlight ? (highlight.has(f) && highlight.has(t)) : (mode==="critical" ? (TIMES[f].slack===0 && TIMES[t].slack===0) : true);
      const dim = highlight ? !onPath : (mode==="critical" ? !onPath : false);
      const col = (onPath && (mode==="critical" || highlight)) ? "var(--primary)" : (dim ? "var(--path-dim)" : "var(--fg)");
      const w = (onPath && (mode==="critical" || highlight)) ? 2.6 : 1.6;
      return `<path d="${edgePath(f,t)}" fill="none" stroke="${col}" stroke-width="${w}" marker-end="url(#arrow)"/>`;
    }).join("");
    let nodes = NODES.map(n => {
      const t = TIMES[n.id];
      const duration = t.ef - t.es;
      const isSel = selected === n.id;
      const onPath = highlight ? highlight.has(n.id) : true;
      const critical = t.slack === 0;
      const known = !revealed || revealed.has(n.id);
      const showF = (mode==="forward"||mode==="backward"||mode==="slack"||mode==="critical") && known;
      const showB = (mode==="backward"||mode==="slack"||mode==="critical") && known;
      const filled = (mode==="critical" && critical) || isSel;
      const dimmed = !!(highlight && !onPath);
      const fill = filled ? "var(--fg)" : "var(--surface)";
      const stroke = filled ? "var(--fg)" : (mode==="critical" && critical ? "var(--primary)" : (dimmed ? "var(--path-dim)" : "var(--fg)"));
      const ink = filled ? "var(--bg)" : (dimmed ? "var(--muted)" : "var(--fg)");
      const muted = filled ? "color-mix(in oklab, var(--bg) 72%, transparent)" : "var(--muted)";
      const click = clickable ? `data-job="${n.id}" style="cursor:pointer"` : "";
      const top = showF ? `<text x="10" y="16" font-size="10" fill="${muted}" font-family="ui-monospace,monospace">${t.es}</text>
        <text x="${NW/2}" y="16" font-size="10" fill="${muted}" font-family="ui-monospace,monospace" text-anchor="middle">${duration}d</text>
        <text x="${NW-10}" y="16" font-size="10" fill="${muted}" font-family="ui-monospace,monospace" text-anchor="end">${t.ef}</text>` : "";
      const bot = showB ? `<text x="10" y="${NH-10}" font-size="10" fill="${muted}" font-family="ui-monospace,monospace">${t.ls}</text>
        <text x="${NW/2}" y="${NH-10}" font-size="10" fill="${mode==="slack" && t.slack>0 ? "var(--warn)" : muted}" font-family="ui-monospace,monospace" text-anchor="middle">${t.slack>0?"+"+t.slack:"0"}</text>
        <text x="${NW-10}" y="${NH-10}" font-size="10" fill="${muted}" font-family="ui-monospace,monospace" text-anchor="end">${t.lf}</text>` : "";
      const midY = showF ? 42 : 34;
      const durPlain = showF ? "" : `<text x="${NW/2}" y="56" text-anchor="middle" font-size="11" fill="${muted}">${duration} days</text>`;
      return `<g transform="translate(${n.x} ${n.y})" ${click}>
        <rect width="${NW}" height="${NH}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${isSel || (mode==="critical"&&critical)?2.2:1.5}"/>
        ${top}
        <text x="${NW/2}" y="${midY}" text-anchor="middle" font-size="22" font-family="Georgia,serif" fill="${ink}">${n.id}</text>
        ${durPlain}${bot}
      </g>`;
    }).join("");
    return `<div class="scrollx"><p class="muted" style="font-size:.75rem;margin-bottom:.4rem" class-sm>Swipe sideways on a small screen to see the whole picture.</p>
      <svg viewBox="0 0 840 340" width="840" height="340" style="max-width:none" role="img" aria-label="Project network of activities A through H">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
        ${edges}${nodes}
      </svg></div>`;
  }

  const VB_W=360, VB_H=280, PAD_L=42, PAD_B=32, PAD_T=18, PAD_R=16, X_MAX=24, Y_MAX=18;
  const xPx = x => PAD_L + (x/X_MAX)*(VB_W-PAD_L-PAD_R);
  const yPx = y => PAD_T + (1-y/Y_MAX)*(VB_H-PAD_T-PAD_B);
  function juiceGraph(x,y,{highlight=null, showUser=true}={}) {
    const sugarX0 = (40-Y_MAX)/2;
    const feasible = [[xPx(0),yPx(0)],[xPx(20),yPx(0)],[xPx(0),yPx(15)]].map(p=>p.join(",")).join(" ");
    const ok = x>=0 && y>=0 && (2*x+y)<=40+1e-9 && (3*x+4*y)<=60+1e-9;
    const ticksX = [0,5,10,15,20].map(t=>`<g><line x1="${xPx(t)}" y1="${yPx(0)}" x2="${xPx(t)}" y2="${yPx(0)+4}" stroke="var(--fg)"/><text x="${xPx(t)}" y="${yPx(0)+16}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="ui-monospace">${t}</text></g>`).join("");
    const ticksY = [0,5,10,15].map(t=>`<g><line x1="${xPx(0)}" y1="${yPx(t)}" x2="${xPx(0)-4}" y2="${yPx(t)}" stroke="var(--fg)"/><text x="${xPx(0)-8}" y="${yPx(t)+3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="ui-monospace">${t}</text></g>`).join("");
    const corners = CORNERS.map(c => `<g>
      <circle cx="${xPx(c.x)}" cy="${yPx(c.y)}" r="${highlight===c.id?7:5}" fill="${c.id==="mango"?"var(--primary)":"var(--fg)"}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${xPx(c.x)+(c.x===0?8:-8)}" y="${yPx(c.y)+(c.y===0?-10:16)}" text-anchor="${c.x===0?"start":"end"}" font-size="9" fill="var(--fg)">(${c.x}, ${c.y})</text>
    </g>`).join("");
    const user = showUser ? `<circle cx="${xPx(x)}" cy="${yPx(y)}" r="6" fill="${ok?"var(--fg)":"var(--danger)"}" stroke="var(--surface)" stroke-width="2"/>` : "";
    return `<svg viewBox="0 0 ${VB_W} ${VB_H}" class="juice-svg" style="width:100%;height:auto" role="img" aria-label="Graph of mango litres versus orange litres">
      <polygon points="${feasible}" fill="var(--primary)" fill-opacity=".12"/>
      <line x1="${xPx(0)}" y1="${yPx(0)}" x2="${xPx(X_MAX)}" y2="${yPx(0)}" stroke="var(--fg)" stroke-width="1.2"/>
      <line x1="${xPx(0)}" y1="${yPx(0)}" x2="${xPx(0)}" y2="${yPx(Y_MAX)}" stroke="var(--fg)" stroke-width="1.2"/>
      ${ticksX}${ticksY}
      <text x="${xPx(12)}" y="${VB_H-2}" text-anchor="middle" font-size="10" fill="var(--muted)">Mango juice, litres (x)</text>
      <text x="12" y="${yPx(9)}" text-anchor="middle" font-size="10" fill="var(--muted)" transform="rotate(-90 12 ${yPx(9)})">Orange juice, litres (y)</text>
      <line x1="${xPx(sugarX0)}" y1="${yPx(Y_MAX)}" x2="${xPx(20)}" y2="${yPx(0)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${xPx(12.4)}" y="${yPx(16)-6}" font-size="9" fill="var(--muted)">sugar wall</text>
      <line x1="${xPx(0)}" y1="${yPx(15)}" x2="${xPx(20)}" y2="${yPx(0)}" stroke="var(--primary)" stroke-width="2"/>
      <text x="${xPx(6)}" y="${yPx(11.2)}" font-size="9" fill="var(--primary)">water wall</text>
      ${corners}${user}
    </svg>`;
  }

  function mixer(x,y){

       </div>
       <p class="key" style="margin-top:1.1rem">Best mix: 20 litres of mango, 0 litres of orange. Maximum profit ₦10,000. Orange is legal, but every litre of orange you add (along the water wall) replaces mango that would have paid more.</p>
       <p class="muted" style="margin-top:.8rem;max-width:36rem;font-size:.9rem">Along the water wall, swapping toward more mango always raises profit. So you slide all the way to (20, 0). Both ingredients run out exactly there.</p>`,
      `<h2 style="font-size:1.6rem">Check that it stuck</h2>
       <div class="panel">
         <p style="font-weight:600">1. What are we maximising?</p>
         ${[{id:"wrong1",t:"Z = 2x + y"},{id:"ok",t:"Z = 500x + 300y"},{id:"wrong2",t:"Z = 3x + 4y"}].map(o=>`<button class="choice ${jq.obj===o.id?"on":""}" data-jq-obj="${o.id}"><span class="mono">${o.t}</span></button>`).join("")}
         ${jq.obj?`<p class="${jq.obj==="ok"?"ok":"danger"}" style="margin-top:.7rem;font-size:.9rem">${jq.obj==="ok"?"Yes. Profit uses the ₦500 and ₦300. The 2, 1, 3, 4 belong in the constraints.":"That is a resource formula, not profit. Profit is 500x + 300y."}</p>`:""}
       </div>
       <div class="panel" style="margin-top:.8rem">
         <p style="font-weight:600">2. What is the best mix?</p>
         ${[{id:"none",t:"0 L mango, 0 L orange"},{id:"orange",t:"0 L mango, 15 L orange"},{id:"mango",t:"20 L mango, 0 L orange"},{id:"half",t:"10 L mango, 10 L orange"}].map(o=>`<button class="choice ${jq.mix===o.id?"on":""}" data-jq-mix="${o.id}">${o.t}</button>`).join("")}
         ${jq.mix?`<p class="${jq.mix==="mango"?"ok":"danger"}" style="margin-top:.7rem;font-size:.9rem">${jq.mix==="mango"?"Yes. That corner scores ₦10,000. 10 and 10 is not even legal — water would be 70 L.": jq.mix==="half"?"10 and 10 needs 70 L of water. Illegal. The winner is 20 mango, 0 orange.":"Legal, but not the richest corner. All mango pays more."}</p>`:""}
       </div>
       <div class="panel" style="margin-top:.8rem">
         <p style="font-weight:600">3. Maximum profit?</p>
         <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem">${[4500,8000,10000,15000].map(n=>`<button class="btn chip ${jq.z===n?"on":""}" data-jq-z="${n}">${naira(n)}</button>`).join("")}</div>
         ${jq.z!=null?`<p class="${jq.z===10000?"ok":"danger"}" style="margin-top:.7rem;font-size:.9rem">${jq.z===10000?"500 × 20 + 300 × 0 = 10,000.":"Compute 500 times 20. Orange is zero at the optimum."}</p>`:""}
       </div>`,
      `<h2 style="font-size:1.6rem">The answers, in one place</h2>
       <div class="panel"><p class="kicker">a. Model</p>
         <div class="display" style="margin-top:.7rem;font-size:1.25rem;line-height:1.45">
           <p>Maximise Z = 500x + 300y</p><p>2x + y ≤ 40</p><p>3x + 4y ≤ 60</p><p>x ≥ 0, y ≥ 0</p>
         </div>
       </div>
       <div class="panel" style="margin-top:.8rem">
         <p class="kicker">b. Optimum</p>
         <p class="display" style="margin-top:.5rem;font-size:1.6rem">x = 20, y = 0</p>
         <p class="soft" style="margin-top:.3rem">20 litres mango juice, 0 litres orange juice.</p>
         <p class="display" style="margin-top:.8rem;font-size:2rem">Maximum profit ${naira(10000)}</p>
       </div>
       <p class="muted" style="margin-top:1.2rem;font-size:.9rem">Revisit <a href="#/network" style="color:var(--primary);text-decoration:underline;text-underline-offset:2px">the project network</a> any time. Both lessons remember the step you left on.</p>`,
    ];
    return chrome("juice", lessonShell({
      kicker:"Question 2 · Linear programming",
      title:"The juice kitchen",
      step, total:7,
      nextLabel: step===0 ? "Write it as maths" : undefined,
      body: bodies[step],
    }));
  }

  function render() {
    S.page = route();
    const root = document.getElementById("app");
    root.innerHTML = S.page==="network" ? networkBody() : S.page==="juice" ? juiceBody() : home();
    bind();
  }

  function bind() {
    document.querySelectorAll("[data-nav]").forEach(el => el.addEventListener("click", () => {
      const d = Number(el.getAttribute("data-nav"));
      if (S.page==="network") { S.nStep = Math.min(8, Math.max(0, S.nStep+d)); saveStep("tlp-network-step", S.nStep); }
      else { S.jStep = Math.min(6, Math.max(0, S.jStep+d)); saveStep("tlp-juice-step", S.jStep); }
      render(); window.scrollTo(0,0);
    }));
    document.querySelectorAll("[data-goto]").forEach(el => el.addEventListener("click", () => {
      const i = Number(el.getAttribute("data-goto"));
      if (S.page==="network") { S.nStep = i; saveStep("tlp-network-step", i); }
      else { S.jStep = i; saveStep("tlp-juice-step", i); }
      render(); window.scrollTo(0,0);
    }));
    document.querySelectorAll("[data-job]").forEach(el => el.addEventListener("click", () => { S.selected = el.getAttribute("data-job"); render(); }));
    document.querySelectorAll("[data-path]").forEach(el => el.addEventListener("click", () => { S.pathId = el.getAttribute("data-path"); render(); }));
    document.querySelectorAll("[data-fwd]").forEach(el => el.addEventListener("click", () => { S.fwd = Math.min(ORDER.length-1, Math.max(0, S.fwd + Number(el.getAttribute("data-fwd")))); render(); }));
    document.querySelectorAll("[data-bwd]").forEach(el => el.addEventListener("click", () => { S.bwd = Math.min(BACKWARD_ORDER.length-1, Math.max(0, S.bwd + Number(el.getAttribute("data-bwd")))); render(); }));
    document.querySelectorAll("[data-focus]").forEach(el => el.addEventListener("click", () => { S.focus = el.getAttribute("data-focus"); render(); }));
    document.querySelectorAll("[data-nq-path]").forEach(el => el.addEventListener("click", () => { S.nQuiz.path = el.getAttribute("data-nq-path"); render(); }));
    document.querySelectorAll("[data-nq-dur]").forEach(el => el.addEventListener("click", () => { S.nQuiz.duration = Number(el.getAttribute("data-nq-dur")); render(); }));
    document.querySelectorAll("[data-nq-job]").forEach(el => el.addEventListener("click", () => {
      const id = el.getAttribute("data-nq-job");
      if (S.nQuiz.picked.has(id)) S.nQuiz.picked.delete(id); else S.nQuiz.picked.add(id);
      render();
    }));
    document.querySelectorAll("[data-math]").forEach(el => el.addEventListener("click", () => { S.maths[el.getAttribute("data-math")] = true; render(); }));
    document.querySelectorAll("[data-corner]").forEach(el => el.addEventListener("click", () => { S.corner = el.getAttribute("data-corner"); render(); }));
    document.querySelectorAll("[data-jq-obj]").forEach(el => el.addEventListener("click", () => { S.jQuiz.obj = el.getAttribute("data-jq-obj"); render(); }));
    document.querySelectorAll("[data-jq-mix]").forEach(el => el.addEventListener("click", () => { S.jQuiz.mix = el.getAttribute("data-jq-mix"); render(); }));
    document.querySelectorAll("[data-jq-z]").forEach(el => el.addEventListener("click", () => { S.jQuiz.z = Number(el.getAttribute("data-jq-z")); render(); }));
    const mx = document.getElementById("mx"), my = document.getElementById("my");
    if (mx) mx.addEventListener("input", e => { S.mix.x = Number(e.target.value); render(); });
    if (my) my.addEventListener("input", e => { S.mix.y = Number(e.target.value); render(); });
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("keydown", e => {
    const tag = (e.target.tagName||"");
    if (tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
    if (S.page==="home") return;
    if (e.key==="ArrowRight") {
      if (S.page==="network" && S.nStep<8) { S.nStep++; saveStep("tlp-network-step", S.nStep); render(); window.scrollTo(0,0); }
      if (S.page==="juice" && S.jStep<6) { S.jStep++; saveStep("tlp-juice-step", S.jStep); render(); window.scrollTo(0,0); }
    }
    if (e.key==="ArrowLeft") {
      if (S.page==="network" && S.nStep>0) { S.nStep--; saveStep("tlp-network-step", S.nStep); render(); window.scrollTo(0,0); }
      if (S.page==="juice" && S.jStep>0) { S.jStep--; saveStep("tlp-juice-step", S.jStep); render(); window.scrollTo(0,0); }
    }
  });
  render();
  </script>
</body>
</html>
